[project]
name = "kuka-zivid-grasshopper-bridge"
version = "0.1.0"
description = "KUKA-Zivid-Grasshopper robot vision bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "PyYAML==6.0.3",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "zivid==2.18.0",
  "open3d==0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
]